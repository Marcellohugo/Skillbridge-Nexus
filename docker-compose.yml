services:
  db:
    image: postgres:16-alpine
    container_name: kuchink_garonk_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kuchink_garonk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kuchink_garonk"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kuchink_garonk_app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      MIGRATE_ON_STARTUP: ${MIGRATE_ON_STARTUP:-true}
      DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-local}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to at least 32 characters}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
